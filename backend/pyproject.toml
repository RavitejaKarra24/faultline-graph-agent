[project]
name = "faultline-backend"
version = "0.1.0"
description = "FalkorDB-backed deterministic incident investigation demo"
readme = "README.md"
authors = [
    { name = "RavitejaKarra24", email = "ravitejakarra24@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
faultline-backend = "faultline_backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a real FalkorDB server; isolated graph per test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
